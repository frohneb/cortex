<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Background Gradient (Deep Sleek Dark) -->
    <linearGradient id="cortexBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Brain / Cortex Gradients -->
    <linearGradient id="violetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- Background Shape with Sleek Subtle Border -->
  <rect width="512" height="512" rx="115" fill="url(#cortexBg)"/>
  <rect width="504" height="504" x="4" y="4" rx="111" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="8"/>

  <!-- Scaled-Up Symmetrical Cortex Brain Architecture & Logic Network -->
  <!-- Left Hemisphere (Tango / Logic Waves - Cyan & Gold) -->
  <g>
    <!-- Circuit Connection Tracks -->
    <path d="M 215 60 C 130 50 60 120 40 220 C 25 320 85 410 135 435 C 180 455 215 465 215 470" 
          fill="none" stroke="url(#cyanGrad)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
    
    <path d="M 215 160 C 135 160 115 256 135 340 C 150 395 185 410 215 410" 
          fill="none" stroke="url(#cyanGrad)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Logic Gates / Bridges (Left) -->
    <line x1="50" y1="220" x2="125" y2="256" stroke="url(#cyanGrad)" stroke-width="14" stroke-linecap="round"/>
    <line x1="85" y1="360" x2="135" y2="340" stroke="url(#cyanGrad)" stroke-width="14" stroke-linecap="round"/>
    <line x1="130" y1="75" x2="135" y2="160" stroke="url(#goldGrad)" stroke-width="14" stroke-linecap="round"/>

    <!-- Left Nodes (Tango Motif Sun & Moon Nodes) -->
    <circle cx="50" cy="220" r="26" fill="url(#cyanGrad)"/>
    <circle cx="130" cy="75" r="24" fill="url(#goldGrad)"/>
    <circle cx="135" cy="340" r="24" fill="#ffffff"/>
    <circle cx="135" cy="435" r="24" fill="url(#cyanGrad)"/>
    <circle cx="215" cy="60" r="20" fill="url(#cyanGrad)"/>
    <circle cx="215" cy="160" r="16" fill="#ffffff"/>
    <circle cx="215" cy="410" r="18" fill="url(#goldGrad)"/>
    <circle cx="215" cy="470" r="20" fill="url(#cyanGrad)"/>
  </g>

  <!-- Right Hemisphere (Sudoku / Matrix Grid Nodes - Violet & Gold) -->
  <g>
    <!-- Circuit Connection Tracks -->
    <path d="M 297 60 C 382 50 452 120 472 220 C 487 320 427 410 377 435 C 332 455 297 465 297 470" 
          fill="none" stroke="url(#violetGrad)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>

    <path d="M 297 160 C 377 160 397 256 377 340 C 362 395 327 410 297 410" 
          fill="none" stroke="url(#violetGrad)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Logic Gates / Bridges (Right) -->
    <line x1="462" y1="220" x2="387" y2="256" stroke="url(#violetGrad)" stroke-width="14" stroke-linecap="round"/>
    <line x1="427" y1="360" x2="377" y2="340" stroke="url(#violetGrad)" stroke-width="14" stroke-linecap="round"/>
    <line x1="382" y1="75" x2="377" y2="160" stroke="url(#goldGrad)" stroke-width="14" stroke-linecap="round"/>

    <!-- Right Nodes (Sudoku Matrix Numbers / Synapses) -->
    <circle cx="462" cy="220" r="26" fill="url(#violetGrad)"/>
    <circle cx="382" cy="75" r="24" fill="url(#goldGrad)"/>
    <circle cx="377" cy="340" r="24" fill="#ffffff"/>
    <circle cx="377" cy="435" r="24" fill="url(#violetGrad)"/>
    <circle cx="297" cy="60" r="20" fill="url(#violetGrad)"/>
    <circle cx="297" cy="160" r="16" fill="#ffffff"/>
    <circle cx="297" cy="410" r="18" fill="url(#goldGrad)"/>
    <circle cx="297" cy="470" r="20" fill="url(#violetGrad)"/>
  </g>

  <!-- Central Synapse Fissure -->
  <line x1="256" y1="50" x2="256" y2="480" stroke="rgba(255,255,255,0.3)" stroke-width="8" stroke-dasharray="20 14" stroke-linecap="round"/>
  <circle cx="256" cy="256" r="22" fill="url(#goldGrad)"/>
</svg>
